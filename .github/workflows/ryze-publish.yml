name: Ryze publish

on:
  push:
    branches: ["main"]
    paths:
      - "blog/data/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Ryze converter
        run: node scripts/ryze-convert.mjs

      - name: Commit generated posts
        run: |
          git config user.name "ryze-bot"
          git config user.email "ryze-bot@users.noreply.github.com"
          git add _posts
          if git diff --cached --quiet; then
            echo "No new posts to commit."
          else
            git commit -m "Ryze: sync published articles [skip ci]"
            git push
          fi
