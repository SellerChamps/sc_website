name: Ryze publish

on:
  push:
    branches: ["main"]
    paths:
      - "blog/data/**"
  workflow_dispatch: {}

# Ryze pushes JSON into blog/data/. Jekyll Pages build (jekyll.yml) runs
# scripts/ryze-convert.mjs before each deploy — no separate _posts commit needed.

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Ryze converter
        run: node scripts/ryze-convert.mjs