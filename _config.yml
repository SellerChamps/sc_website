# ── Site ──────────────────────────────────────────────────────────────
title: SellerChamp
description: >-
  Multichannel listing, inventory, and order management for Amazon, eBay,
  Walmart, Shopify & 20+ channels. From $399/month. Book a free demo.
url: "https://sellerchamp.com"
lang: en-US

# Contact / brand details reused across templates
phone: "(469) 224-5624"
phone_raw: "4692245624"
support_email: "support@sellerchamp.com"

# App URLs (kept in one place so they're easy to swap)
app:
  signin:  "https://app.sellerchamp.com/users/sign_in"
  signup:  "https://app.sellerchamp.com/users/sign_up?scenario=lister_trial"
  leads:   "https://app.sellerchamp.com/leads/new"

# Marketing / analytics (matches live sellerchamp.com)
tracking:
  gtm_id: GTM-PJSCRR2
  facebook_pixel_id: "476998489733035"
  rewardful_id: "0a69b2"
  intercom_app_id: nawne3lq

# ── Build ─────────────────────────────────────────────────────────────
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

sass:
  style: compressed

# Don't copy these into the built _site
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - scripts
  - docs
  - _data/url_inventory.md
  - _data/wp_pages.txt
  - _data/wp_posts.txt

# Collections / defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/

# Pretty permalinks for pages
permalink: pretty
